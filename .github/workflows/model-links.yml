name: Model links

# Checks that the phone models in the app can still be downloaded (a model
# can be moved or renamed on Hugging Face), when the list changes and weekly.
# When the list or the engine changes, each model is also loaded with the
# phone engine and asked a question, to check the engine can run it. Run it
# by hand with a link in "url" to check any other GGUF model the same way.
on:
  push:
    branches: ['main', 'claude/**']
    paths: ['mobile/src/native-engine.js', 'mobile/src/on-device.js', 'scripts/check-model-links.js', 'scripts/model-smoke.c', 'native/llama/engine/**', 'android/app/src/main/cpp/**', '.github/workflows/model-links.yml']
  pull_request:
    paths: ['mobile/src/native-engine.js', 'mobile/src/on-device.js', 'scripts/check-model-links.js', 'scripts/model-smoke.c', 'native/llama/engine/**', 'android/app/src/main/cpp/**', '.github/workflows/model-links.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: "Check this GGUF model link instead of the app's list (or give a Hugging Face repo link to list its files)"
        required: false
        default: ''

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-model-links.js

  run:
    needs: links
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same engine as the phone app (native/llama/engine), on the CPU.
      - name: Build the phone engine for Linux
        run: |
          cmake -S android/app/src/main/cpp -B build-engine -DBALIMDA_OPENCL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-engine -j4
          gcc -std=c11 -Inative/llama/engine/include scripts/model-smoke.c -Lbuild-engine -lbalimda_llama \
            -Wl,-rpath,"$PWD/build-engine" -o model-smoke
      - name: Show what's inside the model
        if: inputs.url != ''
        env:
          URL: ${{ inputs.url }}
        run: |
          # A repo link (https://huggingface.co/owner/name): list its files.
          if [[ "$URL" =~ ^https://huggingface\.co/([^/]+/[^/]+)/?$ ]]; then
            curl -sSfL "https://huggingface.co/api/models/${BASH_REMATCH[1]}/tree/main" |
              jq -r '.[] | "\(.size)\t\(.path)"' | numfmt --field=1 --to=iec
            exit 0
          fi
          pip install --quiet gguf
          curl -sSfL --retry 3 -o model.gguf "$URL"
          ls -l model.gguf
          gguf-dump --no-tensors model.gguf | head -80
          echo "Tensors, by kind:"
          gguf-dump model.gguf | awk -F'|' 'NF >= 4 { n = $4; gsub(/ /, "", n); sub(/\.[0-9]+\..*/, "", n); print n }' | sort | uniq -c
      - name: Load each model and ask it a question
        env:
          URL: ${{ inputs.url }}
        run: |
          fail=0
          [[ "$URL" == *.gguf ]] || [ -z "$URL" ] || exit 0
          urls="$URL"
          [ -n "$urls" ] || urls=$(node scripts/check-model-links.js --urls)
          for url in $urls; do
            name=$(basename "$url")
            echo "::group::$name"
            if { [ -f model.gguf ] || curl -sSfL --retry 3 -o model.gguf "$url"; } && ./model-smoke model.gguf 2>engine.log; then
              echo "ok"
            else
              tail -40 engine.log
              echo "::error::$name doesn't work with the phone engine"
              fail=1
            fi
            rm -f model.gguf
            echo "::endgroup::"
          done
          exit $fail
