name: Android app

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the APK to the "android-latest" release
    env:
      # Your own signing key (see README) -- needed before publishing. Without it
      # the test key in android/app is used (fine for your own phone).
      BALIMDA_KEYSTORE_BASE64: ${{ secrets.BALIMDA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - name: Use your own signing key
        if: env.BALIMDA_KEYSTORE_BASE64 != ''
        run: |
          echo "$BALIMDA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balimda.keystore"
          echo "BALIMDA_KEYSTORE_FILE=$RUNNER_TEMP/balimda.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          BALIMDA_KEYSTORE_PASSWORD: ${{ secrets.BALIMDA_KEYSTORE_PASSWORD }}
          BALIMDA_KEY_ALIAS: ${{ secrets.BALIMDA_KEY_ALIAS }}
          BALIMDA_KEY_PASSWORD: ${{ secrets.BALIMDA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Balimda-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Balimda-android-apk
          path: Balimda-android.apk
          if-no-files-found: error
      # One fixed link that always has the newest APK (no zip):
      # https://github.com/<owner>/<repo>/releases/download/android-latest/Balimda-android.apk
      - name: Publish to the android-latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$GITHUB_SHA" \
              --title "Balimda for Android (latest build)" \
              --notes "Newest Android build. Download Balimda-android.apk and open it on your phone; it installs over the previous version and keeps your chats."
          fi
          gh release upload android-latest Balimda-android.apk --clobber
          gh release delete-asset android-latest Pal-android.apk --yes 2>/dev/null || true
          gh release edit android-latest --title "Balimda for Android (latest build)" --notes "Newest Android build (from ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')). Download Balimda-android.apk and open it on your phone; it installs over the previous version and keeps your chats."
