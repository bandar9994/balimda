   Licensed under the Najwa AI License (see LICENSE): non-commercial use only;
   keep the Najwa AI name and the "Najwa AI by Bandar Altariqi" credit; no rebranding. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Najwa AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="brand"><svg class="brand-mark" viewBox="16 16 480 480" width="24" height="24" aria-hidden="true"><rect x="16" y="16" width="480" height="480" rx="110" fill="#25395f"/><g transform="translate(-6 -10)"><path fill="#e3968d" d="M226 130H346A62 62 0 0 1 408 192V290A62 62 0 0 1 346 352H344L374 402L302 352H226A62 62 0 0 1 164 290V192A62 62 0 0 1 226 130Z"/><path fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" d="M150 362V160L318 362V160"/><path fill="#fff" d="M366 150q5 22 27 27q-22 5-27 27q-5-22-27-27q22-5 27-27z"/></g></svg> <span id="brandName">Najwa AI</span></div>
        <button id="newChatBtn" class="btn primary block" title="New chat (Ctrl+N)">＋ New chat</button>
        <input id="searchInput" class="input" type="search" placeholder="Search all chats (Ctrl+K)" />
      </div>
      <nav id="chatList" aria-label="Chats"></nav>
      <div class="sidebar-foot">
        <button id="settingsBtn" class="btn ghost block" title="Settings (Ctrl+,)">⚙ Settings</button>
        <button id="syncBtn" class="sync-status" hidden></button>
        <button id="creditBtn" class="credit" title="About Najwa AI" translate="no">Najwa AI by Bandar Altariqi</button>
      </div>
    </aside>

    <div id="drawerBackdrop"></div>

    <main id="main">
      <header id="topbar">
        <button id="toggleSidebarBtn" class="icon-btn" title="Toggle sidebar (Ctrl+B)">☰</button>
        <h1 id="chatTitle" dir="auto" title="Click to rename">New chat</h1>
        <div class="topbar-controls">
          <select id="assistantSelect" class="select" title="Assistant"></select>
          <select id="modelSelect" class="select" title="Model"></select>
          <button id="refreshModelsBtn" class="icon-btn" title="Refresh model list">⟳</button>
          <div class="menu-wrap">
            <button id="chatMenuBtn" class="icon-btn" title="Chat options">⋯</button>
            <div id="chatMenu" class="menu" hidden>
              <button data-action="rename">Rename</button>
              <button data-action="pin">Pin</button>
              <button data-action="system">Custom instructions…</button>
              <button data-action="export">Export as Markdown…</button>
              <button data-action="delete" class="danger">Delete chat</button>
            </div>
          </div>
        </div>
      </header>

      <section id="messages" aria-live="polite"></section>

      <footer id="composer">
        <button id="jumpBtn" class="jump-btn" title="Go to the end of the reply" aria-label="Go to the end of the reply" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M11 4h2v12l5.5-5.5 1.4 1.4L12 19.8l-7.9-7.9 1.4-1.4L11 16z"/></svg>
        </button>
        <div id="queued" class="queued" hidden></div>
        <div id="attachments" class="attachments" hidden></div>
        <div class="composer-box">
          <button id="attachBtn" class="icon-btn attach-btn" title="Add a picture or file" aria-label="Add a picture or file">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5H9v9a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v11.5a6 6 0 0 0 12 0v-10h-1.5Z"/></svg>
          </button>
          <input id="attachInput" type="file" multiple hidden>
          <textarea id="input" dir="auto" rows="1" placeholder="Message Najwa AI…"></textarea>
          <button id="micBtn" class="icon-btn mic-btn" title="Talk instead of typing" aria-label="Talk instead of typing" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
          <span id="busyDot" class="busy-dot" role="status" hidden></span>
          <button id="stopBtn" class="icon-btn stop-btn" title="Stop the reply" aria-label="Stop the reply" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
          </button>
          <button id="sendBtn" class="btn primary" title="Send">Send</button>
        </div>
        <div id="composerHint" class="hint">Enter to send · Shift+Enter for a new line · every chat is saved automatically</div>
      </footer>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" role="status" hidden></div>

  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="i18n-ar.js"></script>
  <script src="i18n.js"></script>
  <script src="store-flags.js"></script>
  <script src="report.js"></script>
  <script src="speech-text.js"></script>
  <script src="attach-files.js"></script>
  <script src="save-queue.js"></script>
  <script src="../src/lease.js"></script>
  <script src="app.js"></script>
</body>
</html>
